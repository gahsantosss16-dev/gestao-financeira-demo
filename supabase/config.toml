# Configuração do Supabase CLI para desenvolvimento LOCAL (`supabase start`).
# Nenhum comando deste repositório altera o projeto remoto.
project_id = "associapec-financeiro"

[api]
schemas = ["public"]

[db]
major_version = 15

[auth]
# Deve coincidir com a configuração do projeto remoto (Authentication → URL Configuration).
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:4173/**",
  # quando o domínio for confirmado: "https://financeiro.associapec.com.br/**"
]
enable_signup = false

[auth.email]
enable_signup = false

[functions.nfse]
verify_jwt = true
