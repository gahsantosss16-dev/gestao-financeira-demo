<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recebe Fácil · Demonstração</title>
  <meta name="description" content="Protótipo navegável de gestão financeira e cobrança de clientes. Demonstração com dados fictícios.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b7f37">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b7f37'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="demo-banner" role="note">
    <strong>DEMONSTRAÇÃO</strong>
    <span>Protótipo com dados 100% fictícios · nenhuma mensagem ou cobrança real é enviada</span>
    <button class="demo-reset" data-action="reset-demo" type="button">Restaurar dados</button>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-11"/></svg></span>
        <span class="brand-text"><b>Recebe Fácil</b><small>Gestão &amp; Cobrança</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="company-card">
          <span class="avatar sm">EX</span>
          <div><b>Empresa Exemplo</b><small>Plano Demonstração</small></div>
        </div>
      </div>
    </aside>
    <div class="scrim" data-action="close-menu"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-menu" aria-label="Abrir menu" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <form class="global-search" id="globalSearch" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="globalSearchInput" placeholder="Buscar cliente, documento ou telefone…" autocomplete="off" aria-label="Buscar clientes">
        </form>
        <div class="topbar-actions">
          <button class="icon-btn" data-action="toggle-theme" aria-label="Alternar tema" type="button">
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          </button>
          <a class="icon-btn bell" href="#/alertas" aria-label="Alertas">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="badge-dot" id="alertCount"></span>
          </a>
          <button class="btn primary hide-sm" data-action="new-receivable" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Nova cobrança
          </button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação rápida"></nav>

  <div class="modal-root" id="modalRoot" aria-live="polite"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
