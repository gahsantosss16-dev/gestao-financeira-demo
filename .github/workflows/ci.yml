name: Verificação (tipos, lint, testes e build)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10.9 tem um bug de resolução (edgesOut) com estas dependências.
      - run: npx -y npm@11 ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build com Supabase fictício de desenvolvimento: valida compilação
      # sem conectar a nenhum banco real.
      - run: npm run build
        env:
          VITE_APP_ENV: development
          VITE_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-publica-ficticia
